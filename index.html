<body><div class="interiorBgOverlay" aria-hidden="true"></div><div id="app"><div class="app" id="bootFallback"><div class="topbar"><div class="brand"><div class="brandmark"><img src="devkansh-logo.jpg" alt="Devkansh Interiors"></div><div><b>DEVKANSH INTERIORS</b><small>CLIENT PROJECT PORTAL</small></div></div><div class="menuWrap"><button class="menuBtn" type="button">⋮</button></div></div><div class="wrap landingWrap"><div class="hero"><span class="tag">DEVKANSH INTERIORS</span><h1>Design. Build. Deliver.</h1><p>Explore our reference designs and project videos.</p></div><div class="section"><h2>Registered Clients</h2><p class="small">Loading application…</p></div></div></div></div><div id="toast" class="toast"></div>
<script src="google-drive-config.js"></script>
<script>
const KEY='devkansh_complete_v3';
const stages=['Measurement','Design','Civil','Electrical','Carpentry','Painting','Installation','Handover'];
const SHOWCASE_CATEGORIES=[];
const REFERENCE_DESIGN_CATEGORIES=['2D Design','3D Design','Modular Kitchen Design','Bedroom Design','Living Room Design','Bathroom Design','Office Space Design','Modern Shop Design','Other Design'];
const seed={admin:{u:'admin',p:'admin123'},videoUsers:[],videoPosts:[],showcase:Object.fromEntries(SHOWCASE_CATEGORIES.map(x=>[x,[]])),videos:[],clients:[{id:'c1',userId:'amit01',name:'Amit Sharma',project:'Sharma Residence',mobile:'9876543210',email:'amit@example.com',address:'Mumbai',progress:78,stage:'Carpentry',contract:360000,paid:270000,materials:[['Century Ply','42','Received'],['Hettich Hardware','18','Ordered']],gallery:[],documents:[],updates:[{date:'12 Sep 2026',work:'Wardrobe carcass and kitchen shutters completed.',description:'Team on site: 8',next:'Hardware fitting and paint touch-up.',photos:[],videos:[]}],tasks:[['Hardware selection','Pending'],['Ceiling framing','Urgent']]}],budgetClients:[],vendors:[],projects:[],finance:[],trash:[]};
let db;
try{db=load()}catch(e){db=structuredClone(seed)}
let role=null, currentClient=null, page='dashboard';
function load(){try{const d=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed);if(!d.showcase||typeof d.showcase!=='object')d.showcase={};if(!Array.isArray(d.videos))d.videos=[];if(!Array.isArray(d.videoUsers))d.videoUsers=[];if(!Array.isArray(d.videoPosts))d.videoPosts=[];if(!Array.isArray(d.referenceDesigns))d.referenceDesigns=[];SHOWCASE_CATEGORIES.forEach(x=>{if(!Array.isArray(d.showcase[x]))d.showcase[x]=[]});(d.clients||[]).forEach((c,i)=>{if(!c.userId)c.userId=c.id||('client'+(i+1));if(!c.clientPassword)c.clientPassword='client123';if(!Array.isArray(c.approvalFiles))c.approvalFiles=[]});return d}catch{return structuredClone(seed)}}
let cloudMode = location.protocol !== 'file:';
let cloudAdminAuthenticated = false;
let cloudSaveTimer = null;
function isCloud(){return cloudMode;}
function cloudFileUrl(id){return `/api/files?id=${encodeURIComponent(id)}`;}
async function cloudUploadFile(file,category){
  if(!isCloud()) return {id:'f'+Date.now()+Math.random().toString(36).slice(2),name:file.name,type:file.type||'application/octet-stream',data:await readFileDataURL(file),url:null,size:file.size,category,uploadedAt:new Date().toISOString()};
  const session=await fetch('/api/upload-session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:file.name,mimeType:file.type||'application/octet-stream',size:file.size,category:category||'Uploads'}),cache:'no-store'});
  if(!session.ok){let x={};try{x=await session.json()}catch{};throw new Error(x.error||'Could not start Google Drive upload');}
  const info=await session.json(); if(!info.uploadUrl)throw new Error('Google Drive upload session URL was not returned.');
  const chunkSize=3*1024*1024; let start=0,done=null;
  while(start<file.size){const end=Math.min(start+chunkSize,file.size)-1;const put=await fetch('/api/upload-chunk',{method:'PUT',headers:{'Content-Type':file.type||'application/octet-stream','Content-Range':`bytes ${start}-${end}/${file.size}`,'X-Upload-Url':info.uploadUrl},body:file.slice(start,end+1),cache:'no-store'});if(!put.ok){let x={};try{x=await put.json()}catch{};throw new Error(x.error||`Google Drive upload failed (${put.status})`)}const r=await put.json();if(r.done){done=r.file;break}start=Number.isFinite(r.nextStart)?r.nextStart:end+1;}
  if(!done?.id)throw new Error('Google Drive upload completed without a file ID.');
  return {id:'f'+Date.now()+Math.random().toString(36).slice(2),remoteFileId:done.id,name:done.name||file.name,type:done.mimeType||file.type||'application/octet-stream',url:cloudFileUrl(done.id),data:cloudFileUrl(done.id),size:Number(done.size||file.size),category,uploadedAt:new Date().toISOString()};
}
async function loadCloudPublic(){try{const r=await fetch('/api/public',{cache:'no-store'});if(!r.ok)throw new Error('Cloud public data unavailable');const x=await r.json();db.clients=Array.isArray(x.clients)?x.clients:[];db.referenceDesigns=Array.isArray(x.referenceDesigns)?x.referenceDesigns:[];db.videoUsers=Array.isArray(x.videoUsers)?x.videoUsers:[];db.videoPosts=Array.isArray(x.videoPosts)?x.videoPosts:[];db.videos=Array.isArray(x.videos)?x.videos:[];return true}catch(e){console.warn(e);return false}}
async function loadCloudAdmin(){const r=await fetch('/api/data',{cache:'no-store'});if(!r.ok){let x={};try{x=await r.json()}catch{};throw new Error(x.error||'Cloud data unavailable');}const d=await r.json();db={...db,...d};if(!Array.isArray(db.clients))db.clients=[];if(!Array.isArray(db.budgetClients))db.budgetClients=[];if(!Array.isArray(db.vendors))db.vendors=[];if(!Array.isArray(db.videoUsers))db.videoUsers=[];if(!Array.isArray(db.videoPosts))db.videoPosts=[];if(!Array.isArray(db.referenceDesigns))db.referenceDesigns=[];if(!Array.isArray(db.finance))db.finance=[];return db}
async function cloudPersist(){if(!isCloud()||!cloudAdminAuthenticated)return;const payload={...db};delete payload.admin; // admin password stays only in environment
  const r=await fetch('/api/data',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),cache:'no-store'});if(!r.ok){let x={};try{x=await r.json()}catch{};toast(x.error||'Cloud save failed');throw new Error(x.error||'Cloud save failed');}}
function save(){if(!isCloud())localStorage.setItem(KEY,JSON.stringify(db));publishSync();render();if(isCloud()&&cloudAdminAuthenticated){clearTimeout(cloudSaveTimer);cloudSaveTimer=setTimeout(()=>cloudPersist().catch(console.error),50)}else if(!isCloud()&&window.DEVKANSH_DRIVE_CONFIG?.syncEnabled&&localStorage.getItem('devkansh_drive_auto')==='1')setTimeout(()=>driveSyncAll(false),150)}
async function cloudAdminLogin(username,password){const r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password}),cache:'no-store'});if(!r.ok){let x={};try{x=await r.json()}catch{};throw new Error(x.error||'Invalid admin credentials');}cloudAdminAuthenticated=true;await loadCloudAdmin();}
async function cloudClientLogin(clientId,userId,password){const r=await fetch('/api/client-auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({clientId,userId,password}),cache:'no-store'});if(!r.ok){let x={};try{x=await r.json()}catch{};throw new Error(x.error||'Invalid Client ID or password');}return (await r.json()).client;}
let showcaseChannel=null; try{showcaseChannel=('BroadcastChannel' in window)?new BroadcastChannel('devkansh-showcase-sync'):null}catch(e){showcaseChannel=null}
function publishSync(){try{showcaseChannel?.postMessage({key:KEY,at:Date.now()})}catch(e){}}

// Keep the customer/front application instantly synchronized with Admin Showcase uploads
showcaseChannel?.addEventListener('message',e=>{if(e.data?.key===KEY){db=load();if(role==='client'&&currentClient){currentClient=db.clients.find(x=>x.id===currentClient.id)||db.clients[0]}render()}});
setInterval(()=>{if(isCloud())return;try{const raw=localStorage.getItem(KEY);if(raw){const next=JSON.parse(raw);if(JSON.stringify(next)!==JSON.stringify(db)){db=next;if(role==='client'&&currentClient){currentClient=db.clients.find(x=>x.id===currentClient.id)||db.clients[0]}render()}}}catch(e){}},1500);
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{db=load();render()}catch(_){}}});
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN')}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}

// V95 Google Drive bridge — local app remains usable offline.
function driveCfg(){return window.DEVKANSH_DRIVE_CONFIG||{webAppUrl:'',syncEnabled:false,autoSync:false}}
function driveReady(){const c=driveCfg();return !!(c.syncEnabled&&c.webAppUrl)}
async function driveRequest(payload){const c=driveCfg();if(!c.webAppUrl)throw new Error('Google Drive Web App URL is not configured');const r=await fetch(c.webAppUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});const t=await r.text();let j;try{j=JSON.parse(t)}catch(_){throw new Error('Drive server returned an invalid response')};if(!j.ok)throw new Error(j.error||'Google Drive request failed');return j}
function dataUrlParts(s){const m=String(s).match(/^data:([^;,]+)?(;base64)?,(.*)$/s);if(!m)return null;return {mime:m[1]||'application/octet-stream',base64:m[3]||''}}
async function sha256Text(s){const bytes=new TextEncoder().encode(s);const hash=await crypto.subtle.digest('SHA-256',bytes);return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('')}
function driveFolderForPath(path){const p=path.join('.').toLowerCase();if(p.includes('referencedesign'))return 'Reference Design';if(p.includes('videoposts')||p.includes('videos'))return 'Videos';if(p.includes('gallery'))return 'Project Gallery';if(p.includes('updates'))return 'Daily Updates';if(p.includes('vendors'))return 'Vendors';if(p.includes('documents')||p.includes('approvalfiles'))return 'Documents';if(p.includes('showcase'))return 'Showcase';return 'Backups'}
async function driveExternalize(value,path,seen){
 if(typeof value==='string'&&value.startsWith('data:')){
   if(seen.has(value))return seen.get(value);
   const part=dataUrlParts(value);if(!part)return value;
   const hash=await sha256Text(part.base64);const ext=part.mime==='application/pdf'?'pdf':part.mime.startsWith('video/')?'mp4':part.mime.split('/')[1]||'bin';
   const res=await driveRequest({action:'uploadFile',base64:value,fileName:'Devkansh_'+hash.slice(0,12)+'.'+ext,mimeType:part.mime,folder:driveFolderForPath(path),hash});
   const ref={__driveFile:true,fileId:res.fileId,url:res.url,mimeType:res.mimeType||part.mime,name:res.name||('Devkansh_'+hash.slice(0,12)+'.'+ext)};seen.set(value,ref);return ref;
 }
 if(Array.isArray(value)){const a=[];for(let i=0;i<value.length;i++)a.push(await driveExternalize(value[i],path.concat(String(i)),seen));return a}
 if(value&&typeof value==='object'){const o={};for(const [k,vv] of Object.entries(value))o[k]=await driveExternalize(vv,path.concat(k),seen);return o}
 return value
}
function driveHydrate(value){if(Array.isArray(value))return value.map(driveHydrate);if(value&&typeof value==='object'){if(value.__driveFile&&value.url)return value.url;const o={};for(const[k,vv]of Object.entries(value))o[k]=driveHydrate(vv);return o}return value}
async function driveSyncAll(showToast=true){if(!driveReady()){if(showToast)toast('Configure Google Drive Web App URL first');return}try{if(showToast)toast('Google Drive sync started…');const snapshot=await driveExternalize(db,[],new Map());const res=await driveRequest({action:'saveDatabase',data:snapshot});localStorage.setItem('devkansh_drive_last_sync',new Date().toISOString());if(showToast)toast('All data synced to Google Drive')}catch(e){if(showToast)toast('Drive sync failed: '+e.message)}}
async function driveLoadLatest(showToast=true){if(!driveReady()){if(showToast)toast('Configure Google Drive Web App URL first');return}try{const c=driveCfg();const r=await fetch(c.webAppUrl+'?action=loadDatabase',{method:'GET'});const j=await r.json();if(!j.ok)throw new Error(j.error||'Load failed');if(!j.found){if(showToast)toast('No Google Drive backup found');return}db=driveHydrate(j.data);localStorage.setItem(KEY,JSON.stringify(db));publishSync();render();if(showToast)toast('Latest Google Drive data loaded')}catch(e){if(showToast)toast('Drive load failed: '+e.message)}}
async function driveTestConnection(){if(!driveReady()){toast('First configure Google Drive Web App URL');return}try{const r=await driveRequest({action:'ping'});toast('Google Drive connected')}catch(e){toast('Drive connection failed: '+e.message)}}
function adminDrive(){const c=driveCfg();const last=localStorage.getItem('devkansh_drive_last_sync');return `<div class="hero"><span class="tag">CLOUD DATA</span><h1>Google Drive Sync</h1><p>Local data remains available. This section connects the same application data to your Google Drive folders.</p></div><div class="card"><div class="field"><label>Google Apps Script Web App URL</label><input value="${esc(c.webAppUrl||'')}" placeholder="Paste your /exec URL in google-drive-config.js" readonly></div><div class="small" style="margin-top:8px">Configuration file: <b>google-drive-config.js</b></div><div class="actions" style="margin-top:8px"><button class="btn" onclick="driveTestConnection()">TEST CONNECTION</button><button class="btn light" onclick="driveSyncAll(true)">SYNC ALL DATA TO DRIVE</button><button class="btn light" onclick="driveLoadLatest(true)">LOAD LATEST FROM DRIVE</button></div><div class="field" style="margin-top:12px"><label><input id="drive_auto" type="checkbox" ${localStorage.getItem('devkansh_drive_auto')==='1'?'checked':''} onchange="localStorage.setItem('devkansh_drive_auto',this.checked?'1':'0')"> Auto-sync after every Save</label></div><p class="small" style="margin-top:12px">Last sync: ${last?esc(new Date(last).toLocaleString()):'Not synced yet'}</p></div><div class="section"><h2>Drive folders</h2><div class="card small">Database · Backups · Reference Design · Videos · Project Gallery · Daily Updates · Vendors · Documents · Showcase</div></div>`}

function render(){if(!role)return renderLogin(); if(role==='admin')renderAdmin();else renderClient()}
function renderLogin(){
 const landingNav=`<div class="landingNav"><button class="active" onclick="landingHome()"><span class="navIcon">⌂</span><span class="navLabel">Home</span></button><button onclick="landingReference()"><span class="navIcon">✦</span><span class="navLabel">Reference Design</span></button><button onclick="landingVideos()"><span class="navIcon">▶</span><span class="navLabel">Video</span></button><button onclick="landingMore()"><span class="navIcon">⋮</span><span class="navLabel">More</span></button></div>`;
 document.getElementById('app').innerHTML=`<div class="app"><div class="topbar"><div class="brand"><div class="brandmark"><img src="devkansh-logo.jpg" alt="Devkansh Interiors"></div><div><b>DEVKANSH INTERIORS</b><small>CLIENT PROJECT PORTAL</small></div></div><div class="menuWrap"><button class="menuBtn" onclick="landingMore()">⋮</button></div></div><div class="wrap landingWrap"><div class="hero"><span class="tag">DEVKANSH INTERIORS</span><h1>Design. Build. Deliver.</h1><p>Explore our reference designs and project videos.</p></div><div class="section"><h2>Registered Clients</h2><p class="small">Select your client card to continue. User ID and Password are required after selecting the card.</p><div class="grid clientDirectoryGrid">${(db.clients||[]).map(c=>clientDirectoryCard(c)).join('')||'<div class="empty">No registered clients yet.</div>'}</div></div></div>${landingNav}</div>`;
}
function landingHome(){renderLogin()}
function landingVideos(){
 const u=getVideoSession();
 const posts=(db.videoPosts||[]).map(p=>({...p,user:(db.videoUsers||[]).find(x=>x.id===p.userId),source:'user'}));
 const adminItems=(db.videos||[]).map(v=>({...v,user:null,source:'admin'}));
 const items=[...posts,...adminItems];
 const feed=items.length?items.map((v,i)=>{
   const avatar=v.user?.profilePhoto?`<img src="${v.user.profilePhoto}" alt="Profile">`:`${esc((v.user?.name||'D').slice(0,1).toUpperCase())}`;
   const name=v.user?.name||'Devkansh Interiors'; const sub=v.user?.userId||'Official Video';
   return `<section class="igReelItem">${v.type==='video'?`<video src="${v.data}" muted loop playsinline preload="metadata" ${i===0?'autoplay':''} onclick="toggleReelPlay(this)"></video>`:`<img src="${v.data}" alt="${esc(v.name||'Photo')}">`}<div class="igReelShade"></div><div class="igReelTopMeta" ${v.user?`onclick="openVideoUserProfile('${v.user.id}')"`:''}><div class="igReelAvatar">${avatar}</div><div><div class="igReelName">${esc(name)}</div><div class="igReelSub">${esc(sub)}${v.user?'':' · Official'}</div></div></div><div class="igReelActions"><button class="igReelAction" type="button" onclick="toggleReelPlay(this.closest('.igReelItem')?.querySelector('video'))">♡<small>Like</small></button><button class="igReelAction" type="button" onclick="toast('Comments coming soon')">◯<small>Comment</small></button><button class="igReelAction" type="button" onclick="shareReel(${i})">➤<small>Share</small></button><button class="igReelAction" type="button" onclick="toast('Saved')">▱<small>Save</small></button></div><div class="igReelCaption">${esc(v.name||'Devkansh Interiors')}</div><div class="igReelHint">Swipe up ↑</div></section>`}).join(''):`<section class="igReelItem"><div class="igReelEmpty"><div><div style="font-size:54px">▶</div><b>No videos yet</b><p>Tap ＋ to record a video or upload from your phone.</p></div></div></section>`;
 document.getElementById('app').innerHTML=`<div class="igReelsPage"><div class="igReelsTop"><div class="igReelsTabs"><span class="active">Reels</span><span>Friends</span></div><button class="igReelsPlus" type="button" aria-label="Create video" onclick="toggleVideoAddSheet()">＋</button><button class="igReelsClose" type="button" aria-label="Close" onclick="landingHome()">×</button></div><div class="igReelsFeed" id="igReelsFeed">${feed}</div>${u?`<input id="publicVideoPicker" class="adminVideoPicker" type="file" accept="video/*" onchange="savePublicVideoUpload()"><input id="publicPhotoPicker" class="adminVideoPicker" type="file" accept="image/*" onchange="savePublicPhotoUpload()">`:''}</div>`;

async function startVideoRecording(){if(!navigator.mediaDevices?.getUserMedia){toast('Camera recording is not supported in this browser');return}try{videoRecordStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:true});videoRecordChunks=[];videoRecordSeconds=0;modal('Record Video',`<div class="videoRecordBox"><video id="recordPreview" class="recordPreview" autoplay muted playsinline></video><div id="recordTimer" class="recordTimer">00:00 / 00:30</div><div class="actions" style="justify-content:center"><button id="recordStartBtn" class="btn" type="button" onclick="beginVideoRecording()">● START</button><button id="recordStopBtn" class="btn red" type="button" onclick="stopVideoRecording()" disabled>■ STOP</button></div><p class="small">Maximum video length: 30 seconds.</p></div>`);const preview=document.getElementById('recordPreview');if(preview)preview.srcObject=videoRecordStream}catch(e){toast('Camera/microphone permission is required')}}

function deleteShowcaseItem(category,i){if(!db.showcase?.[category]?.[i])return;if(!confirm('Delete this showcase item?'))return;db.showcase[category].splice(i,1);save();toast('Showcase item deleted')}
function openReferenceCategoryUpload(category){modal('Upload — '+esc(category),`<p class="small">Upload photos or PDF files for <b>${esc(category)}</b>. After selecting, press SAVE.</p><div class="field"><label>PHOTO / PDF</label><input id="referenceCategoryFiles" type="file" accept="image/*,.pdf,application/pdf" multiple></div><button class="btn" type="button" onclick="saveReferenceCategoryUpload('${esc(category)}')">＋ SAVE</button>`)}
async function saveReferenceCategoryUpload(category){const files=Array.from(document.getElementById('referenceCategoryFiles')?.files||[]);if(!files.length){toast('Choose at least one file');return}if(files.some(f=>!f.type.startsWith('image/')&&f.type!=='application/pdf'&&!f.name.toLowerCase().endsWith('.pdf'))){toast('Only photos and PDF files are allowed');return}try{db.referenceDesigns=db.referenceDesigns||[];const items=await Promise.all(files.map(async f=>{const x=await cloudUploadFile(f,`Reference Design/${category}`);return {...x,category,name:f.name,type:(f.type==='application/pdf'||f.name.toLowerCase().endsWith('.pdf'))?'pdf':'image'}}));db.referenceDesigns.push(...items);document.querySelector('.modal')?.remove();save();toast(`Files uploaded to ${category}`)}catch(e){toast(e.message||'Could not upload selected files')}}
function openAdminShowcaseCategory(category){const items=(db.referenceDesigns||[]).filter(x=>x.category===category);const rows=items.map((m)=>{const i=(db.referenceDesigns||[]).indexOf(m);return `<div class="row showcaseAdminRow"><span style="min-width:0;flex:1"><b>${esc(m.name||category)}</b><br><small>${m.type==='pdf'?'PDF':'PHOTO'}</small></span><span class="actions"><button class="btn light" type="button" onclick="openReferenceDesignItem(${i})">VIEW</button><button class="btn red" type="button" onclick="deleteReferenceDesignItem(${i},'${esc(category)}')">DELETE</button></span></div>`}).join('');modal(category,`<div class="card"><p class="small">Reference Design uploads for <b>${esc(category)}</b>.</p><div class="referenceUploadActions"><button class="btn" type="button" onclick="openReferenceCategoryUpload('${esc(category)}')">＋ UPLOAD PHOTO PDF</button></div></div><div style="margin-top:10px">${rows||'<div class="empty">No uploads yet.</div>'}</div>`)}
function deleteReferenceDesignItem(i,category){if(!db.referenceDesigns?.[i])return;if(!confirm('Delete this reference design?'))return;db.referenceDesigns.splice(i,1);save();openAdminShowcaseCategory(category)}
function adminShowcase(){return `<div class="hero"><span class="tag">SHOWCASE → REFERENCE DESIGN</span><h1>Reference Design Showcase</h1><p>Yahan se direct Reference Design categories manage karein. Kisi Registered Client ko select karne ki zarurat nahi hai.</p></div><div class="showcaseAdminGrid referenceShowcaseAdminGrid">${REFERENCE_DESIGN_CATEGORIES.map(cat=>`<div class="showcaseAdminCard referenceShowcaseCard"><button class="showcaseBtn" type="button" onclick="openAdminShowcaseCategory('${esc(cat)}')">${esc(cat)}</button><div class="referenceUploadActions"><button type="button" class="btn showcaseUploadPhotoBtn" onclick="openReferenceCategoryUpload('${esc(cat)}')">＋ UPLOAD PHOTO PDF</button></div><button type="button" class="btn light referenceManageBtn" onclick="openAdminShowcaseCategory('${esc(cat)}')">VIEW / DELETE UPLOADED</button></div>`).join('')}</div>`}
function clientVideos(){const adminItems=(db.videos||[]).map(v=>({...v,user:null,source:'admin'}));const posts=(db.videoPosts||[]).map(p=>({...p,user:(db.videoUsers||[]).find(u=>u.id===p.userId),source:'user'}));const items=[...posts,...adminItems];if(!items.length)return `<div class="hero"><span class="tag">VIDEOS</span><h1>Video</h1><p>Login with mobile number to create your profile, then record/upload videos or photos.</p></div>`;return `<div class="videoReels" id="videoReels">${items.map((v,i)=>`<section class="videoReel">${v.type==='video'?`<video src="${v.data}" muted loop playsinline preload="metadata" ${i===0?'autoplay':''} controls></video>`:`<img src="${v.data}" alt="${esc(v.name||'Photo')}" style="width:100%;height:100%;object-fit:cover">`}${v.user?`<div class="videoPostMeta" onclick="openVideoUserProfile('${v.user.id}')">${videoAvatarHtml(v.user,'videoPostAvatar')}<span class="videoPostProfileText"><span class="videoPostProfileName">${esc(v.user.name)}</span><br><span class="videoPostProfileId">@${esc((v.user.userId||'video').toLowerCase())}</span></span></div>`:`<div class="videoPostMeta"><div class="videoPostAvatar">D</div><span class="videoPostProfileText"><span class="videoPostProfileName">Devkansh Interiors</span><br><span class="videoOfficialBadge">OFFICIAL VIDEO</span></span></div>`}</section>`).join('')}</div><div class="videoReelHint">Swipe up ↑ for next · Swipe down ↓ for previous</div>`}

function initVideoReels(){const box=document.getElementById('videoReels')||document.getElementById('adminVideoReels');if(!box)return;const vs=[...box.querySelectorAll('video')];if(!('IntersectionObserver' in window)){vs[0]?.play().catch(()=>{});return}const io=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target;if(e.isIntersecting){v.play().catch(()=>{});}else v.pause();}),{root:box,threshold:.65});vs.forEach(v=>io.observe(v))}
function openVideoUpload(){modal('Upload Video',`<p class="small">Upload videos for the Video section. Customers will see them in a vertical swipe feed.</p><div class="field"><label>Video</label><input id="video_files" type="file" accept="video/*" multiple></div><button class="btn" onclick="saveVideoUpload()">SAVE VIDEOS</button>`)}
async function saveVideoUpload(){const files=Array.from(document.getElementById('video_files')?.files||[]);if(!files.length){toast('Choose at least one video');return}if(files.some(f=>!f.type.startsWith('video/'))){toast('Only video files are allowed');return}try{await validateVideoFiles(files);const items=await Promise.all(files.map(async f=>{const x=await cloudUploadFile(f,'Videos');return {...x,name:f.name,type:'video'}}));db.videos=db.videos||[];db.videos.push(...items);document.querySelector('.modal')?.remove();save();toast('Videos uploaded')}catch(e){toast(e.message==='LONG_VIDEO'?'Video must be 30 seconds or less':e.message||'Could not upload selected videos')}}
function deleteVideo(i){if(!db.videos?.[i])return;if(!confirm('Delete this video?'))return;db.videos.splice(i,1);save();toast('Video deleted')}
function adminVideos(){const items=db.videos||[];return `<div class="hero"><span class="tag">VIDEO</span><h1>Video</h1><p>Instagram-style vertical video feed. Swipe up or down to move between videos.</p></div><div class="adminVideoStage"><button class="adminVideoPlus" type="button" aria-label="Upload video" title="Upload video" onclick="document.getElementById('adminVideoPicker').click()">＋</button><input id="adminVideoPicker" class="adminVideoPicker" type="file" accept="video/*" multiple onchange="saveVideoUploadFromPicker()">${items.length?`<div class="videoReels" id="adminVideoReels">${items.map((v,i)=>`<section class="videoReel"><video src="${v.data}" muted loop playsinline preload="metadata" controls ${i===0?'autoplay':''}></video><div class="videoReelCaption">${esc(v.name||'Devkansh Interiors')}</div></section>`).join('')}</div>`:`<div class="adminVideoEmpty"><div><div style="font-size:54px;margin-bottom:12px">▶</div><b>No videos uploaded yet.</b><div style="font-size:12px;margin-top:6px">Tap the ＋ icon above to choose videos from your phone or computer.</div></div></div>`}</div>${items.length?`<div class="adminVideoRows"><h3 style="margin-top:0">Manage Videos</h3>${items.map((v,i)=>`<div class="row"><span>${esc(v.name||'Video')}<br><small>video</small></span><span class="actions"><button class="btn light" onclick="openMediaViewer('${v.data}','video','${esc(v.name||'Video')}')">VIEW</button><button class="btn red" onclick="deleteVideo(${i})">DELETE</button></span></div>`).join('')}</div>`:''}${adminVideoUsers()}`}

async function saveVideoUploadFromPicker(){const files=Array.from(document.getElementById('adminVideoPicker')?.files||[]);if(!files.length)return;if(files.some(f=>!f.type.startsWith('video/'))){toast('Only video files are allowed');return}try{await validateVideoFiles(files);const items=await Promise.all(files.map(async f=>{const x=await cloudUploadFile(f,'Videos');return {...x,name:f.name,type:'video'}}));db.videos=db.videos||[];db.videos.push(...items);save();toast('Videos uploaded')}catch(e){toast(e.message==='LONG_VIDEO'?'Video must be 30 seconds or less':e.message||'Could not upload selected videos')}}

function adminVideoUsers(){const users=db.videoUsers||[];return `<div class="videoUserList card"><h3 style="margin-top:0">Video Users</h3>${users.length?users.map(u=>`<div class="row">${videoAvatarHtml(u)}<span style="flex:1"><b>${esc(u.name)}</b><br><small>${esc(u.mobile)} · ${esc(u.userId)}</small></span><button class="btn red" onclick="deleteVideoUser('${u.id}')">DELETE</button></div>`).join(''):'<div class="empty">No video users registered.</div>'}</div>`}
function deleteVideoUser(id){const u=(db.videoUsers||[]).find(x=>x.id===id);if(!u)return;if(!confirm(`Delete Video ID ${u.userId}?`))return;db.videoUsers=db.videoUsers.filter(x=>x.id!==id);db.videoPosts=(db.videoPosts||[]).filter(x=>x.userId!==id);save();toast('Video user deleted')}
function clientDirectoryCard(c){return `<button class="card clientDirectoryCard" onclick="openClientLogin('${esc(c.id)}')"><span class="tag">CLIENT PROJECT</span><h2>${esc(c.name||'Client')}</h2><h3>${esc(c.project||'Project')}</h3><p>${esc(c.address||'')}</p><div class="bar"><i style="width:${Math.max(0,Math.min(100,Number(c.progress)||0))}%"></i></div><div class="row"><span>Project Progress</span><b>${Number(c.progress)||0}%</b></div><span class="btn" style="display:inline-block">OPEN CLIENT CARD</span></button>`}
function openClientLogin(clientId){const c=db.clients.find(x=>x.id===clientId);if(!c)return;modal('Client Login — '+esc(c.name||c.project),`<p class="small">Enter the User ID and Password created by Admin when this client was registered.</p><div class="field"><label>Client User ID</label><input id="card_cid" value="" placeholder="Enter User ID" autocomplete="username"></div><div class="field" style="margin-top:8px"><label>Client Password</label><input id="card_cp" type="password" placeholder="Enter Password" autocomplete="current-password"></div><button class="btn" style="width:100%" onclick="cardClientLogin('${esc(c.id)}')">OPEN MY PROJECT</button>`);setTimeout(()=>document.getElementById('card_cid')?.focus(),50)}
async function cardClientLogin(clientId){const uid=document.getElementById('card_cid')?.value.trim()||'',pw=document.getElementById('card_cp')?.value||'';try{let c;if(isCloud())c=await cloudClientLogin(clientId,uid,pw);else{c=db.clients.find(x=>x.id===clientId&&x.userId===uid&&x.clientPassword===pw);if(!c)throw new Error('Invalid Client User ID or password')}document.querySelector('.modal')?.remove();role='client';currentClient=c;page='home';render()}catch(e){toast(e.message||'Invalid Client User ID or password')}}
function showLandingRole(roleName){const c=document.getElementById('landingClient'),a=document.getElementById('landingAdmin'),ct=document.getElementById('landingClientTab'),at=document.getElementById('landingAdminTab');if(!c||!a)return;if(roleName==='admin'){c.classList.add('hidden');a.classList.remove('hidden');at.classList.add('active');ct.classList.remove('active');}else{a.classList.add('hidden');c.classList.remove('hidden');ct.classList.add('active');at.classList.remove('active');}}
async function landingAdminLogin(){const u=document.getElementById('landingAdminUser')?.value||'',p=document.getElementById('landingAdminPass')?.value||'';try{if(isCloud())await cloudAdminLogin(u,p);else if(!(u==='admin'&&p===db.admin.p))throw new Error('Invalid admin login');role='admin';page='dashboard';render()}catch(e){toast(e.message||'Invalid admin login')}}
function customerLoginForm(){document.getElementById('la').classList.remove('on');document.getElementById('lc').classList.add('on');document.getElementById('loginFields').innerHTML=`<input id="cid" placeholder="Customer User ID"><input id="cp" type="password" placeholder="Customer password"><button class="btn" style="width:100%" onclick="custLogin()">LOGIN TO MY PROJECT</button><p class="small">For local demo, customer password is set in the client record.</p>`}
async function adminLogin(){const u=document.getElementById('u')?.value||'',p=document.getElementById('p')?.value||'';try{if(isCloud())await cloudAdminLogin(u,p);else if(!(u==='admin'&&p===db.admin.p))throw new Error('Invalid admin login');const target=document.querySelector('.modal')?.dataset?.adminTarget||'dashboard';document.querySelector('.modal')?.remove();role='admin';page=target;render();toast('Admin Panel opened')}catch(e){toast(e.message||'Invalid admin login')}}
function goFrontMenu(target){closeMenu();if(target==='home'){role=null;currentClient=null;page='directory';render();return}const m=modal('Admin Login — Secure Access',`<p class="small">Admin credentials are required to open this section.</p><div class="field"><label>Username</label><input id="u" value="admin" autocomplete="username"></div><div class="field" style="margin-top:8px"><label>Password</label><input id="p" type="password" autocomplete="current-password"></div><button class="btn" style="width:100%" onclick="adminLogin()">OPEN</button>`);m?.setAttribute('data-admin-target',target)}
function openAdminGate(){closeMenu();modal('Admin Panel — Secure Access',`<p class="small">Admin Panel is protected. Customer cannot enter without the Admin login.</p><div class="field"><label>Username</label><input id="u" value="admin" autocomplete="username"></div><div class="field" style="margin-top:8px"><label>Password</label><input id="p" type="password" autocomplete="current-password"></div><button class="btn" style="width:100%" onclick="adminLogin()">OPEN ADMIN PANEL</button>`)}
async function custLogin(){const uid=document.getElementById('cid').value.trim();const pw=document.getElementById('cp').value;try{let c;if(isCloud()){const target=db.clients.find(x=>x.userId===uid);if(!target)throw new Error('Invalid Client ID or password');c=await cloudClientLogin(target.id,uid,pw);}else{c=db.clients.find(x=>x.userId===uid&&x.clientPassword===pw);if(!c)throw new Error('Invalid Client ID or password')}role='client';currentClient=c;page='home';render()}catch(e){toast(e.message||'Invalid Client ID or password')}}

function clientNav(){return `<div class="nav">${[['home','⌂','Home'],['updates','◷','Updates'],['videos','▶','Videos'],['gallery','▧','Gallery'],['docs','▤','Docs'],['finance','₹','Finance']].map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('')}</div>`}
function go(p){page=p;render()}
function renderAdmin(){let totalContract=db.clients.reduce((a,c)=>a+(+c.contract||0),0),paid=db.clients.reduce((a,c)=>a+(+c.paid||0),0),exp=db.budgetClients.reduce((a,c)=>a+(+c.spent||0),0)+db.finance.reduce((a,x)=>a+(+x.amount||0),0);let body='';
if(page==='clientWorkspace')body=adminClientWorkspace(adminSelectedClientId);else if(page==='dashboard')body=adminDashboard(totalContract,paid,exp);else if(page==='showcase')body=adminShowcase();else if(page==='videos')body=adminVideos();else if(page==='projects')body=adminProjects();else if(page==='updates')body=adminUpdates();else if(page==='finance')body=adminFinance(totalContract,paid,exp);else if(page==='docs')body=adminDocs();
document.getElementById('app').innerHTML=`<div class="app">${header('ADMIN CONTROL CENTRE')}<div class="wrap">${body}</div>${adminNav()}</div>`}
function adminDashboard(tc,paid,exp){return `<section><div class="hero"><span class="tag">ADMIN CONTROL CENTRE</span><h1>Good morning, Devkansh Team.</h1><p>Project transparency, finance and site operations — all in one place.</p><div class="actions"><button class="btn" onclick="openClient()">＋ New Client</button><button class="btn light" onclick="openBudget()">＋ Client Budget</button><button class="btn light" onclick="openVendor()">＋ Vendor</button><button class="btn light" onclick="go('updates')">＋ Daily Update</button></div></div><div class="stats"><div class="stat"><small>Active Projects</small><b>${db.clients.length}</b></div><div class="stat"><small>Total Contract</small><b>${money(tc)}</b></div><div class="stat"><small>Outstanding</small><b>${money(tc-paid)}</b></div><div class="stat"><small>Expenses</small><b>${money(exp)}</b></div></div><div class="section"><h2>Active Projects</h2><div class="grid">${db.clients.map(c=>projectCard(c)).join('')||'<div class="empty">No clients yet.</div>'}</div></div><div class="section"><h2>Today's Focus</h2><div class="card">${db.clients.flatMap(c=>c.tasks||[]).slice(0,6).map(t=>`<div class="row"><span>${esc(t[0])}<br><small>${esc(db.clients.find(c=>(c.tasks||[]).includes(t))?.project||'')}</small></span><span class="pill">${esc(t[1])}</span></div>`).join('')||'<div class="empty">No tasks.</div>'}</div></div><div class="section"><h2>Client Budget</h2><div class="grid">${db.budgetClients.map(b=>budgetCard(b)).join('')||'<div class="empty">No budget clients. Click + Client Budget.</div>'}</div></div><div class="showcaseTopPanel"><div class="showcaseTopTitle"><b>SHOWCASE</b><span>Upload media for the matching customer button</span></div><div class="showcaseTopButtons">${SHOWCASE_CATEGORIES.map(cat=>`<button type="button" class="showcaseTopBtn" onclick="openShowcaseManager('${esc(cat)}')">${esc(cat)}</button>`).join('')}</div></div><div class="section"><h2>Vendor Registration</h2><div class="grid">${db.vendors.map(v=>`<div class="card"><span class="tag">VENDOR</span><h3>${esc(v.name)}</h3><p>${esc(v.company||'')}</p><div class="small">${esc(v.mobile||'')} · ${esc(v.category||'')}</div><div class="actions"><button class="btn light" onclick="viewVendor('${v.id}')">VIEW DETAILS</button><button class="btn red" onclick="deleteVendor('${v.id}')" title="Delete vendor">✕ DELETE</button></div></div>`).join('')||'<div class="empty">No vendors.</div>'}</div></div></section>`}
function projectCard(c){return `<div class="card project"><span class="tag">${esc(c.stage||'Project')}</span><h3>${esc(c.project||c.name)}</h3><p>${esc(c.name)} · ${esc(c.address)}</p><div class="bar"><i style="width:${Math.max(0,Math.min(100,+c.progress||0))}%"></i></div><b>${c.progress||0}%</b><div class="actions"><button class="btn light" onclick="viewClient('${c.id}')">VIEW CLIENT</button><button class="btn" onclick="editClient('${c.id}')">EDIT</button><button class="btn red" style="padding:8px 12px;font-size:12px;min-width:auto" onclick="deleteClient('${c.id}')" title="Delete client">✕</button></div></div>`}
function budgetCard(b){return `<div class="card"><span class="tag">CLIENT BUDGET</span><h3>${esc(b.name)}</h3><p>${esc(b.mobile)} · ${esc(b.email)}<br>${esc(b.address)}</p><div class="kpi"><div>Budget<b>${money(b.budget)}</b></div><div>Spent<b>${money(b.spent)}</b></div><div>Remaining<b>${money((+b.budget||0)-(+b.spent||0))}</b></div></div><div class="actions"><button class="btn light" onclick="viewBudget('${b.id}')">VIEW</button><button class="btn" onclick="editBudget('${b.id}')">EDIT</button><button class="btn red" onclick="delBudget('${b.id}')">×</button></div></div>`}
function adminProjects(){return `<div class="hero"><span class="tag">PROJECT MANAGEMENT</span><h1>Projects & Clients</h1><p>All normal clients remain separate from Client Budget registrations.</p><button class="btn" onclick="openClient()">＋ ADD CLIENT</button></div><div class="grid">${db.clients.map(projectCard).join('')||'<div class="empty">No projects.</div>'}</div>`}
function adminFinance(tc,paid,exp){return `<div class="hero"><span class="tag">FINANCE</span><h1>Finance Dashboard</h1><p>Contract value, payments, outstanding and expenses.</p></div><div class="stats"><div class="stat"><small>Contract</small><b>${money(tc)}</b></div><div class="stat"><small>Paid</small><b>${money(paid)}</b></div><div class="stat"><small>Outstanding</small><b>${money(tc-paid)}</b></div><div class="stat"><small>Expenses</small><b>${money(exp)}</b></div></div><div class="section"><h2>Expense Entries</h2><button class="btn" onclick="addExpense()">＋ Add Expense</button><div class="card tablewrap" style="margin-top:10px"><table class="table"><tr><th>Date</th><th>Description</th><th>Amount</th><th>Bill</th><th>Action</th></tr>${db.finance.map((x,i)=>`<tr><td>${esc(x.date)}</td><td>${esc(x.description)}</td><td>${money(x.amount)}</td><td>${x.bill?`<button class="btn light" onclick="viewBill('${x.bill}')">VIEW BILL</button>`:`—`}</td><td><button class="btn red" onclick="delExpense(${i})">Delete</button></td></tr>` ).join('')}</table></div></div>`}
function adminUpdates(){return `<div class="hero"><span class="tag">DAILY SITE UPDATE</span><h1>Daily Updates</h1><p>Admin creates updates; customers see only their own project.</p><button class="btn" onclick="openUpdate()">＋ ADD DAILY UPDATE</button></div>${db.clients.map(c=>`<div class="section"><h2>${esc(c.project)}</h2><div class="card">${(c.updates||[]).map((u,i)=>`<div class="row"><span><b>${esc(u.date)}</b><br>${esc(u.work)}</span><span class="actions"><button class="btn light" onclick="viewUpdate('${c.id}',${i})">VIEW</button><button class="btn red" onclick="delUpdate('${c.id}',${i})">DELETE</button></span></div>`).join('')||'<div class="empty">No updates.</div>'}</div></div>`).join('')}`}
function adminDocs(){return `<div class="hero"><span class="tag">DOCUMENT CENTRE</span><h1>Documents & Gallery</h1><p>Drawings, quotations, invoices, receipts, reports and project gallery are managed by Admin.</p><button class="btn" onclick="openDoc()">＋ ADD DOCUMENT</button></div>${db.clients.map(c=>`<div class="section"><h2>${esc(c.project)}</h2><div class="card"><div class="row"><span>Documents</span><span>${(c.documents||[]).length}</span></div><div class="row"><span>Gallery photos</span><span>${(c.gallery||[]).length}</span></div><button class="btn light" onclick="viewClient('${c.id}')">OPEN PROJECT FILES</button></div></div>`).join('')}`}
function renderClient(){const c=db.clients.find(x=>x.id===currentClient.id)||currentClient;currentClient=c;let body='';if(page==='home')body=clientHome(c);if(page==='updates')body=clientUpdates(c);if(page==='gallery')body=clientGallery(c);if(page==='docs')body=clientDocs(c);if(page==='finance')body=clientFinance(c);if(page==='videos')body=clientVideos();document.getElementById('app').innerHTML=`<div class="app">${header('CLIENT PROJECT PORTAL')}<div class="wrap">${body}</div>${clientNav()}</div>`;if(page==='videos')setTimeout(initVideoReels,50)}
function clientHome(c){return `<div class="hero"><span class="tag">CLIENT PROJECT PORTAL</span><h1>${esc(c.project||'My Project')}</h1><p>${esc(c.address)} · ${esc(c.name)}</p><h2>${c.progress||0}% Complete</h2><p>Current stage: ${esc(c.stage)}</p><button class="btn" onclick="go('updates')">Today's Update →</button></div><div class="stats"><div class="stat"><small>Contract Value</small><b>${money(c.contract)}</b></div><div class="stat"><small>Paid</small><b>${money(c.paid)}</b></div><div class="stat"><small>Outstanding</small><b>${money((+c.contract||0)-(+c.paid||0))}</b></div><div class="stat"><small>Budget</small><b>${c.progress||0}%</b></div></div><div class="section"><h2>Project Timeline</h2><div class="card timeline">${stages.map((s,i)=>`<div class="step ${i<=stages.indexOf(c.stage)?'done':''}"><b>${i<=stages.indexOf(c.stage)?'✓':'○'}</b>${s}</div>`).join('')}</div></div><div class="section"><h2>Materials</h2><div class="card">${(c.materials||[]).map(m=>`<div class="row"><span>${esc(m[0])} · Qty ${esc(m[1])}</span><span class="pill">${esc(m[2])}</span></div>`).join('')||'<div class="empty">No material updates.</div>'}</div></div><div class="section"><h2>Approvals</h2><div class="card"><div class="row"><span>Design / Documents</span><span class="pill">${(c.approvalFiles||[]).filter(x=>x.status==='Pending').length} Pending</span></div><div class="row"><span>Materials</span><span class="pill">View only</span></div><div class="row"><span>Quotation</span><span class="pill">View only</span></div></div></div>${clientApprovalSection(c)}`}
function clientUpdates(c){return `<div class="hero"><span class="tag">DAILY SITE UPDATE</span><h1>${esc(c.project)}</h1><p>Read-only customer view.</p></div>${(c.updates||[]).map(u=>`<div class="card section"><b>${esc(u.date)}</b><h3>${esc(u.work)}</h3><p>${esc(u.description)}</p><p>Team: ${esc(u.description?.match(/Team[^0-9]*(\d+)/i)?.[1]||'—')}</p><b>Next-day plan:</b><p>${esc(u.next)}</p>${u.photos?.length?`<div class="gallery">${u.photos.map(x=>`<img src="${x}" alt="update photo">`).join('')}</div>`:''}${u.videos?.length?`<div class="section"><b>Videos (${u.videos.length})</b><div class="gallery">${u.videos.map(x=>`<video src="${x}" controls playsinline style="width:100%;border-radius:10px;border:1px solid #D9D9D2;background:#111"></video>`).join('')}</div></div>`:''}</div>`).join('')||'<div class="empty">No daily updates yet.</div>'}`}
function viewMedia(src,title='Media'){const isVideo=/^data:video\//i.test(src)||/\.(mp4|webm|ogg)(\?|$)/i.test(src);modal(title,isVideo?`<video src="${src}" controls autoplay playsinline style="width:100%;max-height:78vh;background:#111;border-radius:12px"></video><button class="btn light" onclick="document.querySelector('.modal')?.remove()">CLOSE</button>`:`<img src="${src}" alt="${esc(title)}" style="width:100%;max-height:78vh;object-fit:contain;border-radius:12px"><button class="btn light" onclick="document.querySelector('.modal')?.remove()">CLOSE</button>`) }
function clientGallery(c){return `<div class="hero"><span class="tag">GALLERY / MEDIA</span><h1>Project Gallery</h1><p>Tap any photo or video to open it in a larger viewer.</p></div><div class="card">${(c.gallery||[]).length?`<div class="gallery">${c.gallery.map((x,i)=>`<button type="button" class="mediaThumb" style="padding:0;background:transparent;width:100%;text-align:left" onclick="viewMedia('${esc(x)}','Project Photo')"><img src="${esc(x)}" alt="Project photo ${i+1}" style="cursor:pointer"></button>`).join('')}</div>`:'<div class="empty">No gallery photos yet.</div>'}</div>`}
function clientDocs(c){return `<div class="hero"><span class="tag">DOCUMENTS & DRAWINGS</span><h1>Project Documents</h1><p>Customer has view-only access. Approval files can be approved or marked not approved.</p></div>${clientApprovalSection(c)}<div class="section"><h2>Other Project Documents</h2><div class="card">${(c.documents||[]).map(d=>`<div class="row"><span>${esc(d.name)}</span><button class="btn light" onclick="window.open('${d.data}','_blank')">VIEW</button></div>`).join('')||'<div class="empty">No documents yet.</div>'}</div></div>`}
function clientFinance(c){return `<div class="hero"><span class="tag">FINANCE</span><h1>Project Finance</h1><p>Read-only payment visibility.</p></div><div class="stats"><div class="stat"><small>Contract</small><b>${money(c.contract)}</b></div><div class="stat"><small>Paid</small><b>${money(c.paid)}</b></div><div class="stat"><small>Outstanding</small><b>${money((+c.contract||0)-(+c.paid||0))}</b></div><div class="stat"><small>Progress</small><b>${c.progress||0}%</b></div></div>`}
function modal(title,html){const e=document.createElement('div');e.className='modal';e.innerHTML=`<div class="modalbox"><div style="display:flex;justify-content:space-between;align-items:center"><h2>${title}</h2><button class="btn red" onclick="this.closest('.modal').remove()">×</button></div>${html}</div>`;document.body.appendChild(e);return e}
function openClient(id=''){let c=db.clients.find(x=>x.id===id)||{};const m=modal(id?'Edit Client':'Add New Client',`<div class="formgrid"><div class="field"><label>Client Name</label><input id="f_name" value="${esc(c.name)}"></div><div class="field"><label>Project Name</label><input id="f_project" value="${esc(c.project)}"></div><div class="field"><label>Mobile Number</label><input id="f_mobile" value="${esc(c.mobile)}"></div><div class="field"><label>Email ID</label><input id="f_email" value="${esc(c.email)}"></div><div class="field"><label>Address</label><input id="f_address" value="${esc(c.address)}"></div><div class="field"><label>Progress %</label><input id="f_progress" type="number" value="${c.progress||0}"></div><div class="field"><label>Stage</label><select id="f_stage">${stages.map(s=>`<option ${s===c.stage?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Contract Value ₹</label><input id="f_contract" type="number" value="${c.contract||0}"></div><div class="field"><label>Paid ₹</label><input id="f_paid" type="number" value="${c.paid||0}"></div><div class="field"><label>Customer User ID *</label><input id="f_uid" value="${esc(c.userId||'')}" placeholder="e.g. amit01" autocomplete="username"></div><div class="field"><label>Customer Password *</label><input id="f_pw" type="text" value="${esc(c.clientPassword||'')}" placeholder="Set customer password" autocomplete="new-password"></div></div><button class="btn" onclick="saveClient('${id}')">SAVE CLIENT</button>`);}
function saveClient(id){let c=db.clients.find(x=>x.id===id);if(!c){c={id:'c'+Date.now(),materials:[],gallery:[],documents:[],updates:[],tasks:[]};db.clients.push(c)}const uid=v('f_uid').trim(), pw=v('f_pw').trim();if(!uid||!pw){toast('Customer User ID and password are required');return}const duplicate=db.clients.some(x=>x!==c&&x.userId===uid);if(duplicate){toast('Customer User ID already exists');return}Object.assign(c,{userId:uid,clientPassword:pw,name:v('f_name'),project:v('f_project'),mobile:v('f_mobile'),email:v('f_email'),address:v('f_address'),progress:+v('f_progress')||0,stage:v('f_stage'),contract:+v('f_contract')||0,paid:+v('f_paid')||0});document.querySelector('.modal')?.remove();save();toast('Client saved')}
function openBudget(){const clients=db.clients||[];modal('Client Budget',`<div class="field"><label>Select Registered Client</label><select id="budgetClientSelect" onchange="loadBudgetClientDetails()"><option value="">— Select Client —</option>${clients.map(c=>`<option value="${esc(c.id)}">${esc(c.name||c.project||'Client')} — ${esc(c.project||'')}</option>`).join('')}</select><div class="small" style="margin-top:6px">Type the client name on the dropdown to quickly find a registered client.</div></div><div id="budgetClientDetails" style="margin-top:14px"><div class="empty">Please select a registered client above.</div></div>`)}
function loadBudgetClientDetails(){const clientId=v('budgetClientSelect');const box=document.getElementById('budgetClientDetails');if(!box)return;if(!clientId){box.innerHTML='<div class="empty">Please select a registered client above.</div>';return}const c=db.clients.find(x=>x.id===clientId);if(!c){box.innerHTML='<div class="empty">Client not found.</div>';return}const b=db.budgetClients.find(x=>x.clientId===clientId);box.innerHTML=`<div class="card" style="margin-bottom:12px"><span class="tag">SELECTED CLIENT</span><h3>${esc(c.name||c.project)}</h3><p>${esc(c.project||'')}<br>${esc(c.mobile||'')} · ${esc(c.email||'')}<br>${esc(c.address||'')}</p></div><div class="field"><label>Total Budget ₹ *</label><input id="b_budget" type="number" min="0" value="${b?.budget||0}" placeholder="Enter total budget"></div><button class="btn" onclick="saveSelectedClientBudget()">SAVE BUDGET</button>${b?`<div class="section"><h3>Current Budget</h3><div class="kpi"><div>Budget<b>${money(b.budget||0)}</b></div><div>Spent<b>${money(b.spent||0)}</b></div><div>Remaining<b>${money((+b.budget||0)-(+b.spent||0))}</b></div></div><button class="btn light" onclick="viewBudget('${b.id}')">VIEW PRODUCTS / EXPENSES</button></div>`:''}` }
function saveSelectedClientBudget(){const clientId=v('budgetClientSelect');if(!clientId){toast('Please select a client');return}const c=db.clients.find(x=>x.id===clientId);if(!c){toast('Client not found');return}let b=db.budgetClients.find(x=>x.clientId===clientId);if(!b){b={id:'b'+Date.now(),clientId:c.id,spent:0,products:[]};db.budgetClients.push(b)}Object.assign(b,{clientId:c.id,name:c.name,mobile:c.mobile,email:c.email,address:c.address,budget:+v('b_budget')||0});save();document.querySelector('.modal')?.remove();toast('Client budget saved')}
function budgetClientPickerCards(clients){return clients.map(c=>{const b=db.budgetClients.find(x=>x.clientId===c.id);return `<div class="card budget-picker" data-search="${esc(((c.name||'')+' '+(c.project||'')).toLowerCase())}"><span class="tag">REGISTERED CLIENT</span><h3>${esc(c.name||c.project)}</h3><p>${esc(c.project||'')}<br>${esc(c.mobile||'')} · ${esc(c.email||'')}</p><button class="btn" onclick="openBudgetForClient('${c.id}')">${b?'OPEN / EDIT BUDGET':'SET CLIENT BUDGET'}</button></div>`}).join('')||'<div class="empty">No registered clients found. Add the client first from Add Client.</div>'}
function filterBudgetClients(){const q=(v('budgetClientSearch')||'').trim().toLowerCase();document.querySelectorAll('#budgetClientList .budget-picker').forEach(el=>{el.style.display=!q||el.dataset.search.includes(q)?'':'none'})}
function openBudgetForClient(clientId){const c=db.clients.find(x=>x.id===clientId);if(!c){toast('Client not found');return}let b=db.budgetClients.find(x=>x.clientId===clientId);if(!b){b={id:'b'+Date.now(),clientId:c.id,spent:0,products:[]};db.budgetClients.push(b);save()}modal('Client Budget — '+esc(c.name||c.project),`<div class="card" style="margin-bottom:12px"><span class="tag">SELECTED REGISTERED CLIENT</span><h3>${esc(c.name||c.project)}</h3><p>${esc(c.project||'')}<br>${esc(c.mobile||'')} · ${esc(c.email||'')}<br>${esc(c.address||'')}</p></div><div class="formgrid"><div class="field"><label>Total Budget ₹ *</label><input id="b_budget" type="number" value="${b.budget||0}"></div></div><button class="btn" onclick="saveBudget('${b.id}','${c.id}')">SAVE BUDGET</button><div class="section"><h3>Current Budget</h3><div class="kpi"><div>Budget<b>${money(b.budget||0)}</b></div><div>Spent<b>${money(b.spent||0)}</b></div><div>Remaining<b>${money((+b.budget||0)-(+b.spent||0))}</b></div></div></div><button class="btn light" onclick="viewBudget('${b.id}')">VIEW PRODUCTS / EXPENSES</button>`)}
function saveBudget(id,clientId){const c=db.clients.find(x=>x.id===clientId);let b=db.budgetClients.find(x=>x.id===id);if(!b){b={id:'b'+Date.now(),clientId:clientId,spent:0,products:[]};db.budgetClients.push(b)}if(!c){toast('Client not found');return}Object.assign(b,{clientId:c.id,name:c.name,mobile:c.mobile,email:c.email,address:c.address,budget:+v('b_budget')||0});document.querySelector('.modal')?.remove();save();toast('Client budget saved')}
function editBudget(id){const b=db.budgetClients.find(x=>x.id===id);if(b?.clientId)openBudgetForClient(b.clientId);else openBudget()}
function viewBudget(id){const b=db.budgetClients.find(x=>x.id===id);if(!b)return;const c=db.clients.find(x=>x.id===b.clientId);const clientName=c?.name||b.name||'Client';modal('Client Budget — '+esc(clientName),`<div class="kpi"><div>Total Budget<b>${money(b.budget)}</b></div><div>Total Spent<b>${money(b.spent)}</b></div><div>Remaining<b>${money(b.budget-b.spent)}</b></div></div><div class="section"><h3>Product / Expense List</h3><div class="tablewrap"><table class="table"><tr><th>S.No</th><th>Date</th><th>Product</th><th>Rate</th><th>Amount</th><th>Description</th><th>Bill</th><th>Action</th></tr>${(b.products||[]).map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.date)}</td><td>${esc(p.name)}</td><td>${money(p.rate)}</td><td>${money(p.amount)}</td><td>${esc(p.desc)}</td><td>${p.bill?`<button class="btn light" onclick="viewBill('${p.bill}')">VIEW BILL</button>`:`—`}</td><td><button class="btn red" style="padding:6px 10px;font-size:12px;min-width:auto" onclick="deleteBudgetProduct('${id}',${i})" title="Delete product">✕ DELETE</button></td></tr>` ).join('')}</table></div></div><button class="btn" onclick="addBudgetProduct('${b.id}')">＋ ADD PRODUCT / EXPENSE</button>`)}
function addBudgetProduct(id){const b=db.budgetClients.find(x=>x.id===id);modal('Add New Product / Expense',`<div class="formgrid"><div class="field"><label>Product Name</label><input id="p_name" placeholder="Plywood"></div><div class="field"><label>Rate ₹</label><input id="p_rate" type="number"></div><div class="field"><label>Amount ₹</label><input id="p_amount" type="number"></div><div class="field"><label>Date</label><input id="p_date" type="date"></div><div class="field"><label>Description</label><input id="p_desc"></div><div class="field"><label>Bill Photo * (MANDATORY)</label><input id="p_bill" type="file" accept="image/*" required><div class="small">Bill photo ke bina entry save nahi hogi.</div></div></div><button class="btn" onclick="saveBudgetProduct('${id}')">＋ ADD PRODUCT / EXPENSE</button>`)}
async function saveBudgetProduct(id){const bill=document.getElementById('p_bill')?.files?.[0];if(!bill){toast('Bill photo is required');return}let b=db.budgetClients.find(x=>x.id===id);if(!b)return;try{const x=await cloudUploadFile(bill,'Budget Bills');let p={name:v('p_name'),rate:+v('p_rate')||0,amount:+v('p_amount')||0,date:v('p_date')||new Date().toISOString().slice(0,10),desc:v('p_desc'),bill:x.url||x.data,billName:bill.name,remoteFileId:x.remoteFileId};b.products=b.products||[];b.products.push(p);b.spent=b.products.reduce((a,x)=>a+(+x.amount||0),0);document.querySelector('.modal')?.remove();save();toast('Product added with bill')}catch(e){toast(e.message||'Bill upload failed')}}
function viewBill(data){modal('Bill Photo',`<img src="${data}" style="width:100%;max-height:70vh;object-fit:contain;border-radius:12px"><button class="btn light" onclick="document.querySelector('.modal')?.remove()">CLOSE</button>`)}
function deleteBudgetProduct(budgetId,index){const b=db.budgetClients.find(x=>x.id===budgetId);if(!b||!Array.isArray(b.products)||!b.products[index])return;if(!confirm('Delete this product / expense?'))return;b.products.splice(index,1);b.spent=b.products.reduce((a,x)=>a+(+x.amount||0),0);save();viewBudget(budgetId);toast('Product / expense deleted')}

async function saveVendor(){const a=document.getElementById('v_aadhar')?.files?.[0],p=document.getElementById('v_pan')?.files?.[0],b=document.getElementById('v_bank')?.files?.[0],g=document.getElementById('v_gst_doc')?.files?.[0];if(!v('v_name').trim()){toast('Vendor name is required');return}if(!a||!p||!b){toast('Aadhaar, PAN and Bank documents are required');return}try{const [aadhar,pan,bank,gstDoc]=await Promise.all([cloudUploadFile(a,'Vendor/Aadhaar'),cloudUploadFile(p,'Vendor/PAN'),cloudUploadFile(b,'Vendor/Bank'),g?cloudUploadFile(g,'Vendor/GST'):Promise.resolve(null)]);db.vendors.push({id:'v'+Date.now(),name:v('v_name'),company:v('v_company'),mobile:v('v_mobile'),email:v('v_email'),address:v('v_address'),gst:v('v_gst'),category:v('v_cat'),notes:v('v_notes'),documents:{aadhar,pan,bank,gst:gstDoc},createdAt:new Date().toISOString()});document.querySelector('.modal')?.remove();save();toast('Vendor saved with documents')}catch(e){toast(e.message||'Could not upload vendor documents')}}
function viewVendor(id){let vnd=db.vendors.find(x=>x.id===id);if(!vnd)return;const docs=vnd.documents||{};const docRow=(label,d)=>d?`<div class="row"><span><b>${label}</b><br><small>${esc(d.name||'Document')}</small></span><button class="btn light" onclick="window.open('${d.data}','_blank')">VIEW</button></div>`:`<div class="row"><span>${label}</span><span class="pill">Not uploaded</span></div>`;modal('Vendor Details',`<p><b>Name:</b> ${esc(vnd.name)}</p><p><b>Company:</b> ${esc(vnd.company)}</p><p><b>Mobile:</b> ${esc(vnd.mobile)}</p><p><b>Email:</b> ${esc(vnd.email)}</p><p><b>Address:</b> ${esc(vnd.address)}</p><p><b>GST:</b> ${esc(vnd.gst||'Not provided')}</p><p><b>Category:</b> ${esc(vnd.category)}</p><p><b>Notes:</b> ${esc(vnd.notes)}</p><h3>Vendor Documents</h3>${docRow('Aadhaar Card',docs.aadhar)}${docRow('PAN Card',docs.pan)}${docRow('Bank Details',docs.bank)}${docRow('GST Certificate (Optional)',docs.gst)}<button class="btn red" onclick="deleteVendor('${id}')">✕ DELETE VENDOR</button>`)}

function showDailyFileCounts(){const ps=document.getElementById('u_photos')?.files?.length||0,vs=document.getElementById('u_videos')?.files?.length||0;const pc=document.getElementById('u_photo_count'),vc=document.getElementById('u_video_count');if(pc)pc.textContent=`${ps} photo(s) selected — required: 1 to 10`;if(vc)vc.textContent=`${vs} video(s) selected — required: minimum 2`;}
function readFileDataURL(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error||new Error('File read failed'));r.readAsDataURL(file)})}
function readImageDataURLCompressed(file,maxSide=320,quality=0.72){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,maxSide/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round((img.naturalWidth||img.width)*scale));c.height=Math.max(1,Math.round((img.naturalHeight||img.height)*scale));const ctx=c.getContext('2d');ctx.drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',quality))};img.onerror=()=>reject(new Error('Image decode failed'));img.src=r.result};r.onerror=()=>reject(r.error||new Error('File read failed'));r.readAsDataURL(file)})}
async function saveUpdate(){const c=db.clients.find(x=>x.id===v('u_client'));if(!c){toast('Please select a client');return}const photoFiles=Array.from(document.getElementById('u_photos')?.files||[]),videoFiles=Array.from(document.getElementById('u_videos')?.files||[]);if(photoFiles.length<1||photoFiles.length>10){toast('Daily update requires 1 to 10 photos');return}if(videoFiles.length<2){toast('Daily update requires at least 2 videos');return}if(!v('u_work').trim()){toast('Work is required');return}try{const photos=await Promise.all(photoFiles.map(f=>cloudUploadFile(f,'Daily Updates/Photos'))),videos=await Promise.all(videoFiles.map(async f=>{await validateVideoFiles([f]);return cloudUploadFile(f,'Daily Updates/Videos')}));c.updates=c.updates||[];c.updates.unshift({date:v('u_date')||new Date().toISOString().slice(0,10),work:v('u_work'),description:v('u_desc'),next:v('u_next'),photos,videos});document.querySelector('.modal')?.remove();save();toast('Daily update saved with photos and videos')}catch(e){toast(e.message==='LONG_VIDEO'?'Video must be 30 seconds or less':e.message||'Could not upload one or more files')}}

function viewClient(id){const c=db.clients.find(x=>x.id===id);if(!c)return;adminSelectedClientId=id;currentClient=c;role='admin';page='clientWorkspace';render();}
function adminClientWorkspace(id){const c=db.clients.find(x=>x.id===id);if(!c){page='dashboard';return adminDashboard(0,0,0)}const approvals=(c.approvalFiles||[]);const approved=approvals.filter(x=>x.status==='Approved').length;const pending=approvals.filter(x=>x.status==='Pending').length;const rejected=approvals.filter(x=>x.status==='Not Approved').length;const spent=(c.budget?.spent||0);return `<div class="hero"><div class="actions" style="justify-content:space-between"><button class="btn light" onclick="adminSelectedClientId=null;go('dashboard')">← BACK TO ALL CLIENTS</button><span class="rolebadge">SINGLE CLIENT WORKSPACE</span></div><span class="tag">CLIENT PROJECT</span><h1>${esc(c.project||c.name)}</h1><p>${esc(c.name)} · ${esc(c.address)}</p><div class="actions"><button class="btn" onclick="editClient('${c.id}')">EDIT CLIENT DETAILS</button><button class="btn light" onclick="openApprovalUpload('${c.id}')">＋ UPLOAD APPROVAL FILE</button><button class="btn light" onclick="openDocumentOnlyForClient('${c.id}')">＋ ADD DOCUMENT</button><button class="btn light" onclick="openGalleryOnlyForClient('${c.id}')">＋ ADD GALLERY PHOTO</button></div></div><div class="stats"><div class="stat"><small>Progress</small><b>${c.progress||0}%</b></div><div class="stat"><small>Contract</small><b>${money(c.contract)}</b></div><div class="stat"><small>Paid</small><b>${money(c.paid)}</b></div><div class="stat"><small>Outstanding</small><b>${money((+c.contract||0)-(+c.paid||0))}</b></div></div><div class="section"><h2>Design / Document Approvals</h2><div class="card"><div class="kpi"><div>Approved<b>${approved}</b></div><div>Pending<b>${pending}</b></div><div>Not Approved<b>${rejected}</b></div></div>${approvals.map((d,i)=>`<div class="row"><span><b>${esc(d.name)}</b><br><small>${esc(d.type||'File')} · ${esc(d.uploadedAt||'')}</small></span><span class="actions"><span class="pill">${esc(d.status||'Pending')}</span><button class="btn light" onclick="openApprovalFile('${c.id}',${i})">VIEW</button><button class="btn red" onclick="deleteApprovalFile('${c.id}',${i})">DELETE</button></span></div>`).join('')||'<div class="empty">No approval files yet. Upload a drawing, design PDF or photo for this client.</div>'}</div></div><div class="section"><h2>Daily Updates — ${esc(c.project)}</h2><div class="card">${(c.updates||[]).map((u,i)=>`<div class="row"><span><b>${esc(u.date)}</b><br>${esc(u.work)}</span><span class="actions"><button class="btn light" onclick="viewUpdate('${c.id}',${i})">VIEW</button><button class="btn red" onclick="delUpdate('${c.id}',${i})">DELETE</button></span></div>`).join('')||'<div class="empty">No daily updates yet.</div>'}</div></div><div class="section"><h2>Project Documents</h2><div class="card"><div class="row"><span>Documents</span><b>${(c.documents||[]).length}</b></div>${(c.documents||[]).map((d,i)=>`<div class="row"><span><b>${esc(d.name||'Document')}</b></span><span class="actions"><a class="btn light" download="${esc(d.name||'document')}" href="${d.data}">OPEN / DOWNLOAD</a><button class="btn red" onclick="deleteClientDocument('${c.id}',${i})">✕ DELETE</button></span></div>`).join('')||'<div class="empty">No documents yet.</div>'}</div></div><div class="section"><h2>Project Gallery</h2><div class="card"><div class="row"><span>Gallery Photos</span><b>${(c.gallery||[]).length}</b></div>${(c.gallery||[]).length?`<div class="gallery">${c.gallery.map((x,i)=>`<div><img src="${x}" alt="Project photo" style="cursor:pointer"><div class="actions"><button class="btn light" onclick="window.open('${x}','_blank')">VIEW</button><button class="btn red" onclick="deleteClientGallery('${c.id}',${i})">✕ DELETE</button></div></div>`).join('')}</div>`:'<div class="empty">No gallery photos yet.</div>'}</div></div><div class="section"><h2>Client Finance</h2><div class="stats"><div class="stat"><small>Contract</small><b>${money(c.contract)}</b></div><div class="stat"><small>Paid</small><b>${money(c.paid)}</b></div><div class="stat"><small>Outstanding</small><b>${money((+c.contract||0)-(+c.paid||0))}</b></div><div class="stat"><small>Progress</small><b>${c.progress||0}%</b></div></div></div>`}
function editClient(id){openClient(id)}
function deleteClient(id){const c=db.clients.find(x=>x.id===id);if(!c)return;const label=c.project||c.name||'this client';if(!confirm(`Delete ${label}? This will remove the client from Active Projects and the client panel. The client's budget record will also be removed.`))return;db.clients=db.clients.filter(x=>x.id!==id);db.budgetClients=(db.budgetClients||[]).filter(x=>x.clientId!==id);if(currentClient?.id===id){currentClient=null;role=null;page='directory'}if(adminSelectedClientId===id)adminSelectedClientId=null;save();toast('Client deleted') }
function switchToCustomer(){role='client';currentClient=db.clients[0];page='home';render()}
function switchToAdmin(){role='admin';page='dashboard';render()}
function logout(){role=null;currentClient=null;render()}
function v(id){return document.getElementById(id)?.value||''}
let adminSelectedClientId=null;
function renderAdminLoginPage(){document.getElementById('app').innerHTML=`<div class="app login"><div class="hero"><span class="tag">SECURE ADMIN ACCESS</span><h1>Devkansh Interior Admin</h1><p>Admin Panel is separate from the customer menu.</p><div class="field"><label>Admin Username</label><input id="admin_u" value="admin"></div><div class="field"><label>Admin Password</label><input id="admin_p" type="password"></div><button class="btn" style="width:100%" onclick="adminPageLogin()">OPEN ADMIN PANEL</button><a class="btn light" style="display:block;text-align:center;text-decoration:none" href="/api/google-auth">CONNECT GOOGLE DRIVE</a><p class="small">Google Drive authorization is completed once; the server then stores project data and media in your authorized Drive.</p></div></div>`}
async function adminPageLogin(){try{if(isCloud())await cloudAdminLogin(v('admin_u'),v('admin_p'));else if(!(v('admin_u')==='admin'&&v('admin_p')===db.admin.p))throw new Error('Invalid admin login');role='admin';page='dashboard';render()}catch(e){toast(e.message||'Invalid admin login')}}
async function bootCloudAware(){try{if(window.__ADMIN_PAGE__ || new URLSearchParams(location.search).get('admin')==='1'){role=null;renderAdminLoginPage();return}role=null;currentClient=null;page='directory';render();if(isCloud()){await loadCloudPublic();render()}}catch(e){console.error('Devkansh boot error',e);try{render()}catch(_){}}}bootCloudAware();
// Keep the customer view synced when Admin changes data from another tab/window.
window.addEventListener('storage',e=>{if(e.key===KEY){db=load();if(role==='client'&&currentClient){currentClient=db.clients.find(x=>x.id===currentClient.id)||db.clients[0];render()}}});
</script></body></html>
